<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos San | Ofertas Gastronómicas</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
        }
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }
        .hero {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .hero .appLogo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: contain;
            background: #111;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
            border: 1px solid #232323;
        }
        .hero h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #ff6b35;
            line-height: 1.1;
        }
        .hero h2 {
            margin: 4px 0 0;
            font-size: 0.95rem;
            color: #c8c8c8;
            font-weight: 400;
        }

        .estado-carga, .sin-ofertas {
            text-align: center;
            color: #888;
            padding: 60px 20px;
            font-size: 1.05rem;
        }

        .categoria-row {
            margin-bottom: 36px;
        }
        .categoria-titulo {
            color: #ff6b35;
            font-size: 1.25rem;
            margin: 0 0 12px 2px;
            font-weight: 700;
        }
        .poster-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 4px 2px 12px;
            scroll-snap-type: x proximity;
        }
        .poster-scroll::-webkit-scrollbar { height: 8px; }
        .poster-scroll::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 8px; }

        .poster-card {
            flex: 0 0 auto;
            width: 150px;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.2s ease;
        }
        .poster-card:hover { transform: scale(1.05); }
        .poster-img {
            width: 150px;
            height: 225px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #232323;
            display: block;
        }
        .poster-placeholder {
            background: #151515;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        .poster-titulo {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #e8e8e8;
            font-weight: 600;
            line-height: 1.25;
        }
        .poster-local {
            font-size: 0.78rem;
            color: #888;
            margin-top: 2px;
        }

        /* Modal de detalle */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 0 0 24px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px; right: 12px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 34px; height: 34px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 1;
        }
        .modal-img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 16px 16px 0 0;
        }
        .modal-body { padding: 20px 22px 0; }
        .modal-titulo {
            margin: 0 0 4px;
            color: #fff;
            font-size: 1.3rem;
        }
        .modal-local {
            margin: 0 0 14px;
            color: #ff6b35;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .modal-desc {
            color: #c8c8c8;
            line-height: 1.6;
            margin: 0 0 14px;
        }
        .modal-precio {
            color: #28a745;
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0 0 18px;
        }
        .btn-whatsapp {
            display: inline-flex;
            width: 100%;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: #25d366;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            border-radius: 999px;
            padding: 14px 26px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 28px rgba(37, 211, 102, 0.25);
        }
        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px rgba(37, 211, 102, 0.32);
        }
        .sin-whatsapp {
            color: #888;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero">
            <img class="appLogo" src="logo.png" alt="Pedidos San Logo">
            <div>
                <h1>Pedidos San</h1>
                <h2>Elegí qué comer hoy</h2>
            </div>
        </div>

        <div id="categoriasContainer">
            <div class="estado-carga">Cargando ofertas...</div>
        </div>
    </div>

    <!-- Firebase Config (solo lectura de categorías/ofertas/clientes) -->
    <script src="firebase-config.js"></script>
    <script>
        let categoriasCache = [];
        let ofertasCache = [];
        let clientesCache = [];

        function iniciarLanding() {
            if (typeof window.firebaseFunctions === 'undefined') {
                setTimeout(iniciarLanding, 300);
                return;
            }
            cargarLanding();
        }

        async function cargarLanding() {
            const f = window.firebaseFunctions;
            try {
                [categoriasCache, ofertasCache, clientesCache] = await Promise.all([
                    f.getCategorias(),
                    f.getOfertas(),
                    f.getClientes()
                ]);
                categoriasCache.sort((a, b) => (a.orden || 0) - (b.orden || 0));
                renderLanding();
            } catch (error) {
                console.error('Error cargando la landing:', error);
                document.getElementById('categoriasContainer').innerHTML =
                    '<div class="sin-ofertas">No se pudieron cargar las ofertas. Intentá recargar la página.</div>';
            }
        }

        function nombreLocal(clienteId) {
            const c = clientesCache.find(c => c.id === clienteId);
            return c ? c.nombre : '';
        }

        function renderLanding() {
            const cont = document.getElementById('categoriasContainer');
            const activas = ofertasCache.filter(o => o.activo);
            const categoriasConOfertas = categoriasCache.filter(cat => activas.some(o => o.categoriaId === cat.id));

            if (categoriasConOfertas.length === 0) {
                cont.innerHTML = '<div class="sin-ofertas">Todavía no hay ofertas cargadas. ¡Volvé pronto!</div>';
                return;
            }

            cont.innerHTML = categoriasConOfertas.map(cat => {
                const ofertasCat = activas.filter(o => o.categoriaId === cat.id);
                return `
                    <div class="categoria-row">
                        <h2 class="categoria-titulo">${cat.nombre}</h2>
                        <div class="poster-scroll">
                            ${ofertasCat.map(o => `
                                <div class="poster-card" onclick="abrirDetalleOferta(${o.id})">
                                    ${o.imagenUrl
                                        ? `<img class="poster-img" src="${o.imagenUrl}" alt="${o.titulo}">`
                                        : `<div class="poster-img poster-placeholder">🍽️</div>`}
                                    <div class="poster-titulo">${o.titulo}</div>
                                    <div class="poster-local">${nombreLocal(o.clienteId)}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function abrirDetalleOferta(id) {
            const o = ofertasCache.find(o => o.id === id);
            if (!o) return;
            const cliente = clientesCache.find(c => c.id === o.clienteId);
            const telefono = cliente && cliente.telefono ? cliente.telefono.replace(/\D/g, '') : '';
            const mensaje = encodeURIComponent(`Hola! Vi "${o.titulo}"${cliente ? ' de ' + cliente.nombre : ''} en Pedidos San y quiero pedirlo.`);

            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.onclick = e => { if (e.target === modal) modal.remove(); };
            modal.innerHTML = `
                <div class="modal-card">
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                    ${o.imagenUrl ? `<img class="modal-img" src="${o.imagenUrl}" alt="${o.titulo}">` : ''}
                    <div class="modal-body">
                        <h2 class="modal-titulo">${o.titulo}</h2>
                        <p class="modal-local">🏢 ${cliente ? cliente.nombre : 'Local'}</p>
                        ${o.descripcion ? `<p class="modal-desc">${o.descripcion}</p>` : ''}
                        ${o.precio != null ? `<p class="modal-precio">$${o.precio}</p>` : ''}
                        ${telefono && telefono.length >= 8
                            ? `<a class="btn-whatsapp" href="https://wa.me/${telefono}?text=${mensaje}" target="_blank" rel="noopener noreferrer">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20.52 3.48C18.32 1.28 15.3 0 12.01 0 5.39 0 .01 5.39 .01 12c0 2.12.56 4.19 1.62 6L0 24l6.26-1.64c1.75.96 3.73 1.47 5.75 1.47h.01c6.62 0 12.01-5.39 12.01-12 0-3.29-1.28-6.31-3.47-8.52zm-8.51 18.14c-2.02 0-3.99-.54-5.69-1.55l-.41-.24-3.71.98.99-3.62-.27-.38A9.87 9.87 0 0 1 2.01 12c0-5.46 4.44-9.9 9.9-9.9 2.65 0 5.14 1.03 7.01 2.9A9.858 9.858 0 0 1 22.01 12c0 5.46-4.44 9.9-9.9 9.9zm5.4-7.38c-.3-.15-1.78-.88-2.06-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.95 1.18-.17.2-.34.22-.63.08-.3-.15-1.24-.46-2.36-1.45-.87-.76-1.46-1.7-1.63-2-.17-.3-.02-.46.13-.61.14-.14.3-.36.45-.54.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.08-.15-.68-1.64-.94-2.26-.25-.58-.51-.5-.68-.51h-.58c-.2 0-.52.07-.8.37-.28.3-1.07 1.05-1.07 2.56 0 1.51 1.09 2.97 1.24 3.17.15.2 2.14 3.25 5.19 4.55.73.32 1.3.51 1.74.65.73.23 1.4.2 1.93.12.59-.1 1.78-.73 2.03-1.44.25-.71.25-1.32.18-1.45-.07-.12-.26-.2-.55-.35z" fill="#fff"/>
                                </svg>
                                Pedir por WhatsApp
                              </a>`
                            : `<p class="sin-whatsapp">Este local todavía no tiene WhatsApp cargado.</p>`}
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        document.addEventListener('DOMContentLoaded', iniciarLanding);
    </script>
</body>
</html>
